<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#080C14"/><stop offset="50%" stop-color="#0F172A"/><stop offset="100%" stop-color="#050B14"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38BDF8" stop-opacity=".8"/><stop offset="100%" stop-color="#818CF8" stop-opacity=".8"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#C084FC"/><stop offset="100%" stop-color="#3B82F6"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38BDF8" stop-opacity=".25"/><stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1E293B" stroke-opacity=".5" stroke-width=".8" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes streamFlow{0%{stroke-dashoffset:440}}@keyframes pulseGlow{0%{transform:scale(1);opacity:.4}}@keyframes floatWave{0%{transform:translateY(0)}}.grid-bg{opacity:.7}.stream{stroke-dasharray:20 400;animation:streamFlow 6s linear infinite}.stream-fast{stroke-dasharray:40 300;animation:streamFlow 3.5s linear infinite}.stream-delayed{stroke-dasharray:30 350;animation:streamFlow 5s linear infinite 1.5s}.pulse-node{animation:pulseGlow 3s ease-in-out infinite alternate}.pulse-node-2{animation:pulseGlow 2.5s ease-in-out infinite alternate 1s}.wave-path{animation:floatWave 8s ease-in-out infinite alternate}.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:48px;letter-spacing:-.5px;fill:#fff}.subtitle-text{font-weight:400;font-size:20px;fill:#94a3b8;letter-spacing:.2px}.badge-pill{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,sans-serif;font-weight:600;font-size:13px;fill:#38bdf8}</style></defs><rect width="1200" height="320" fill="url(#bgGrad)"/><rect width="1200" height="320" fill="url(#grid)" class="grid-bg"/><circle cx="200" cy="160" r="220" fill="url(#glow)"/><circle cx="1000" cy="120" r="260" fill="url(#glow)"/><g class="wave-path" opacity=".6"><path fill="none" stroke="#1E293B" stroke-width="2" d="M-50 240 Q 250 180 500 250 T 1050 200 T 1250 260"/><path fill="none" stroke="url(#accentCyan)" stroke-width="2.5" d="M-50 240 Q 250 180 500 250 T 1050 200 T 1250 260" class="stream"/><path fill="none" stroke="#1E293B" stroke-width="2" d="M-50 100 Q 350 220 700 120 T 1250 160"/><path fill="none" stroke="url(#accentPurple)" stroke-width="2.5" d="M-50 100 Q 350 220 700 120 T 1250 160" class="stream-delayed"/><path fill="none" stroke="url(#accentCyan)" stroke-width="2" d="M-50 280 Q 400 140 850 270 T 1250 120" class="stream-fast"/></g><g opacity=".7"><circle cx="250" cy="200" r="5" fill="#38BDF8" class="pulse-node"/><circle cx="500" cy="250" r="6" fill="#818CF8" class="pulse-node-2"/><circle cx="700" cy="120" r="5" fill="#C084FC" class="pulse-node"/><circle cx="1050" cy="200" r="6" fill="#38BDF8" class="pulse-node-2"/></g><rect width="1080" height="230" x="60" y="45" fill="#0F172A" fill-opacity=".5" stroke="#334155" stroke-width="1.5" rx="16"/><rect width="1080" height="4" x="60" y="45" fill="url(#accentCyan)"/><g><text x="0" y="0" class="title-text" transform="translate(100, 125)">Awesome Lakehouse Platform 🏞️⚡</text><text x="0" y="38" class="subtitle-text" transform="translate(100, 125)">Curated Open Table Formats (Iceberg, Delta, Hudi), Multi-Engine Query &amp; Cloud Analytics</text></g><g transform="translate(100, 205)"><rect width="140" height="32" x="0" y="0" fill="#1E293B" stroke="#38BDF8" stroke-width="1" rx="16"/><text x="70" y="21" class="badge-pill" text-anchor="middle">🧊 Apache Iceberg</text><rect width="120" height="32" x="152" y="0" fill="#1E293B" stroke="#818CF8" stroke-width="1" rx="16"/><text x="212" y="21" fill="#818CF8" class="badge-pill" text-anchor="middle">📐 Delta Lake</text><rect width="130" height="32" x="284" y="0" fill="#1E293B" stroke="#C084FC" stroke-width="1" rx="16"/><text x="349" y="21" fill="#C084FC" class="badge-pill" text-anchor="middle">🪵 Apache Hudi</text><rect width="130" height="32" x="426" y="0" fill="#1E293B" stroke="#38BDF8" stroke-width="1" rx="16"/><text x="491" y="21" class="badge-pill" text-anchor="middle">⚡ Trino &amp; Spark</text></g></svg>