<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.5"/>
    </pattern>

    <!-- Dynamic Animations -->
    <style>
      .grid-bg { opacity: 0.7; }
      
      /* Animated Data Streams */
      .stream {
        stroke-dasharray: 20 400;
        animation: streamFlow 6s linear infinite;
      }
      .stream-fast {
        stroke-dasharray: 40 300;
        animation: streamFlow 3.5s linear infinite;
      }
      .stream-delayed {
        stroke-dasharray: 30 350;
        animation: streamFlow 5s linear infinite 1.5s;
      }

      @keyframes streamFlow {
        0% { stroke-dashoffset: 440; }
        100% { stroke-dashoffset: -440; }
      }

      /* Glowing Nodes Pulse */
      .pulse-node {
        animation: pulseGlow 3s ease-in-out infinite alternate;
      }
      .pulse-node-2 {
        animation: pulseGlow 2.5s ease-in-out infinite alternate 1s;
      }

      @keyframes pulseGlow {
        0% { transform: scale(1); opacity: 0.4; }
        100% { transform: scale(1.4); opacity: 1; filter: drop-shadow(0 0 8px #38BDF8); }
      }

      /* Floating Wave Animation */
      .wave-path {
        animation: floatWave 8s ease-in-out infinite alternate;
      }

      @keyframes floatWave {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }

      /* Foreground Title Styling */
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 48px;
        letter-spacing: -0.5px;
        fill: #FFFFFF;
      }
      
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 20px;
        fill: #94A3B8;
        letter-spacing: 0.2px;
      }

      .badge-pill {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38BDF8;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#grid)" class="grid-bg"/>
  
  <!-- Glowing Background Auras -->
  <circle cx="200" cy="160" r="220" fill="url(#glow)"/>
  <circle cx="1000" cy="120" r="260" fill="url(#glow)"/>

  <!-- Background Dynamic Network/Wave Lines (Z-INDEX LOWER THAN TEXT) -->
  <g class="wave-path" opacity="0.6">
    <!-- Connecting Tech Lines -->
    <path d="M-50 240 Q 250 180 500 250 T 1050 200 T 1250 260" fill="none" stroke="#1E293B" stroke-width="2"/>
    <path d="M-50 240 Q 250 180 500 250 T 1050 200 T 1250 260" fill="none" stroke="url(#accentCyan)" stroke-width="2.5" class="stream"/>

    <path d="M-50 100 Q 350 220 700 120 T 1250 160" fill="none" stroke="#1E293B" stroke-width="2"/>
    <path d="M-50 100 Q 350 220 700 120 T 1250 160" fill="none" stroke="url(#accentPurple)" stroke-width="2.5" class="stream-delayed"/>

    <path d="M-50 280 Q 400 140 850 270 T 1250 120" fill="none" stroke="url(#accentCyan)" stroke-width="2" class="stream-fast"/>
  </g>

  <!-- Animated Data Nodes (Background) -->
  <g opacity="0.7">
    <circle cx="250" cy="200" r="5" fill="#38BDF8" class="pulse-node"/>
    <circle cx="500" cy="250" r="6" fill="#818CF8" class="pulse-node-2"/>
    <circle cx="700" cy="120" r="5" fill="#C084FC" class="pulse-node"/>
    <circle cx="1050" cy="200" r="6" fill="#38BDF8" class="pulse-node-2"/>
  </g>

  <!-- Decorative Architectural Elements / Framing -->
  <rect x="60" y="45" width="1080" height="230" rx="16" fill="#0F172A" fill-opacity="0.5" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Accent Bar -->
  <rect x="60" y="45" width="1080" height="4" fill="url(#accentCyan)"/>

  <!-- FOREGROUND TEXT CONTENT (GUARANTEED ON TOP) -->
  <g transform="translate(100, 125)">
    <!-- Main Title -->
    <text class="title-text" x="0" y="0">
      Awesome Lakehouse Platform 🏞️⚡
    </text>

    <!-- Subtitle -->
    <text class="subtitle-text" x="0" y="38">
      Curated Open Table Formats (Iceberg, Delta, Hudi), Multi-Engine Query &amp; Cloud Analytics
    </text>
  </g>

  <!-- Feature Pills / Badges in Banner Foreground -->
  <g transform="translate(100, 205)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text class="badge-pill" x="70" y="21" text-anchor="middle">🧊 Apache Iceberg</text>

    <!-- Pill 2 -->
    <rect x="152" y="0" width="120" height="32" rx="16" fill="#1E293B" stroke="#818CF8" stroke-width="1"/>
    <text class="badge-pill" x="212" y="21" text-anchor="middle" fill="#818CF8">📐 Delta Lake</text>

    <!-- Pill 3 -->
    <rect x="284" y="0" width="130" height="32" rx="16" fill="#1E293B" stroke="#C084FC" stroke-width="1"/>
    <text class="badge-pill" x="349" y="21" text-anchor="middle" fill="#C084FC">🪵 Apache Hudi</text>

    <!-- Pill 4 -->
    <rect x="426" y="0" width="130" height="32" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text class="badge-pill" x="491" y="21" text-anchor="middle">⚡ Trino &amp; Spark</text>
  </g>
</svg>
